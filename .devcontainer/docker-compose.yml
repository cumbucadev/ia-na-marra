version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      # Monta o diretório de trabalho do projeto no container de desenvolvimento
      - ..:/workspace:cached
    
    # Garante que o container continue rodando no VS Code
    command: sleep infinity

    # Dependência leve para garantir que o Koboldcpp inicie junto
    depends_on:
      - koboldcpp

  koboldcpp:
    build:
      context: .
      dockerfile: Dockerfile.koboldcpp
    volumes:
      - ../models:/models
    ports:
      - "5001:5001"
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    restart: unless-stopped